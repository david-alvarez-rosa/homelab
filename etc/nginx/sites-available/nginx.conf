map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
  listen 80; listen [::]:80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name david.alvarezrosa.com www.alvarezrosa.com alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/david.alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/david.alvarezrosa.com/privkey.pem;

  root /srv/david.alvarezrosa.com;
  index index.html;
  error_page 404 /404/index.html;

  if ($host != david.alvarezrosa.com) {
    return 301 https://david.alvarezrosa.com$request_uri;
  }

  location / { try_files $uri $uri/ =404; }

  location ~* \.(woff2?|ttf|webp|png|jpe?g|ico|svg|css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name david.alvarezmagan.com;

  ssl_certificate /etc/letsencrypt/live/david.alvarezmagan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/david.alvarezmagan.com/privkey.pem;

  root /srv/david.alvarezrosa.com;
  index index.html;
  error_page 404 /404/index.html;

  location / { try_files $uri $uri/ =404; }

  location ~* \.(woff2?|ttf|webp|png|jpe?g|ico|svg|css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name api.alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/api.alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.alvarezrosa.com/privkey.pem;

  location / {
    include proxy_params;
    proxy_pass http://127.0.0.1:8000;
  }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name beta.alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/beta.alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/beta.alvarezrosa.com/privkey.pem;

  root /srv/beta.alvarezrosa.com;
  index index.html;
  error_page 404 /404/index.html;

  auth_basic "Beta site";
  auth_basic_user_file /etc/nginx/.htpasswd-beta;

  location / { try_files $uri $uri/ =404; }

  location ~* \.(woff2?|ttf|webp|png|jpe?g|ico|svg|css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name analytics.alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/analytics.alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/analytics.alvarezrosa.com/privkey.pem;

  location / {
    include proxy_params;
    proxy_pass http://127.0.0.1:3000;
  }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name unwall.app www.unwall.app;

  ssl_certificate /etc/letsencrypt/live/unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unwall.app/privkey.pem;

  root /srv/unwall.app;
  index index.html;

  if ($host != unwall.app) {
    return 301 https://unwall.app$request_uri;
  }

  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name api.unwall.app;

  ssl_certificate /etc/letsencrypt/live/api.unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.unwall.app/privkey.pem;

  location / {
    include proxy_params;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://127.0.0.1:3001;
  }
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name cloud.alvarezrosa.com cloud.alvarezmagan.com;

  ssl_certificate /etc/letsencrypt/live/cloud.alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cloud.alvarezrosa.com/privkey.pem;

  client_max_body_size 0;
  proxy_read_timeout 3600;
  proxy_send_timeout 3600;

    location / {
        proxy_pass http://127.0.0.1:11000$request_uri; # Adjust to match APACHE_PORT and APACHE_IP_BINDING. See https://github.com/nextcloud/all-in-one/blob/main/reverse-proxy.md#adapting-the-sample-web-server-configurations-below

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header Early-Data $ssl_early_data;

        # Websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    ssl_dhparam /etc/dhparam; # curl -L https://ssl-config.mozilla.org/ffdhe2048.txt -o /etc/dhparam

    ssl_early_data on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve x25519:x448:secp521r1:secp384r1:secp256r1;

    ssl_prefer_server_ciphers on;
    ssl_conf_command Options PrioritizeChaCha;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256;
}
