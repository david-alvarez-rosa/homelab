server {
  listen 443 ssl reuseport;
  listen [::]:443 ssl reuseport;
  listen 443 quic reuseport;
  listen [::]:443 quic reuseport;
  http2 on;
  server_name david.alvarezrosa.com www.alvarezrosa.com alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/alvarezrosa.com/privkey.pem;
  ssl_early_data on;

  include common_headers.conf;

  root /srv/david.alvarezrosa.com;
  index index.html;
  error_page 404 /404/index.html;

  if ($host != david.alvarezrosa.com) {
    return 301 https://david.alvarezrosa.com$request_uri;
  }

  location = /sitemap-extra.xml { root /srv; }

  location = /dn { return 301 /dn/; }

  location ^~ /dn/ {
    alias /srv/dn/;
    index index.html;

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $request_filename;
      fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
  }

  location = /pasatiempos-dn { return 301 /pasatiempos-dn/; }

  location ^~ /pasatiempos-dn/ {
    alias /srv/pasatiempos-dn/;
    index index.php index.html;
    try_files $uri $uri/ /pasatiempos-dn/index.php?$query_string;

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $request_filename;
      fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
  }

  location = /tres-en-raya { return 301 /tres-en-raya/; }
  location ~ ^/tic-tac-toe(/[^\r\n]*)?$ { return 301 /tres-en-raya$1; }
  location ~ ^/proyecto(/[^\r\n]*)?$ { return 301 /tres-en-raya$1; }

  location ^~ /tres-en-raya/ {
    alias /srv/tic-tac-toe/web/;
    index index.php index.html;
    try_files $uri $uri/ =404;

    location ~ \.php$ {
      fastcgi_pass unix:/run/php/php8.4-fpm.sock;
      fastcgi_param SCRIPT_FILENAME $request_filename;
      include fastcgi_params;
    }

    location ~ /cgi-bin/(.+)$ {
      gzip off;
      fastcgi_pass unix:/var/run/fcgiwrap.socket;
      fastcgi_param SCRIPT_FILENAME /srv/tic-tac-toe/web/cgi-bin/$1;
      include fastcgi_params;
    }
  }

  location = /blog { return 301 /posts/; }
  location ^~ /posts/about-this-website { return 301 /posts/about-this-site/; }
  location = /blog/hello-world/ { return 301 /posts/about-this-site/; }
  location = /blog/hello-world.html { return 301 /posts/about-this-site/; }
  location ^~ /blog/ { return 301 /posts/; }
  location = /es { return 301 /; }
  location ^~ /es/ { return 301 /; }
  location = /atom.xml { return 301 /index.xml; }
  location = /feed.xml { return 301 /index.xml; }
  location = /pdf/cv-david-alvarez-rosa.pdf { return 301 /about/; }
  location = /about/pdf/cv-david-alvarez-rosa.pdf { return 301 /about/; }

  location / {
    try_files $uri $uri/ =404;
    include common_headers.conf;
    add_header Cache-Control "public, max-age=600, s-maxage=31536000";
    add_header Link '</fonts/alegreya-normal-latin.woff2>; rel=preload; as=font; type="font/woff2"; crossorigin' always;
    add_header Link '</fonts/alegreya-italic-latin.woff2>; rel=preload; as=font; type="font/woff2"; crossorigin' always;
    add_header Link '</fonts/alegreya-sc-normal-700-latin.woff2>; rel=preload; as=font; type="font/woff2"; crossorigin' always;
  }

  include static_assets.conf;
}

