server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    server_name david.alvarezrosa.com www.alvarezrosa.com alvarezrosa.com;

    ssl_certificate /etc/letsencrypt/live/david.alvarezrosa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/david.alvarezrosa.com/privkey.pem;

    add_header Alt-Svc 'h3=":443"; ma=604800';

    root /srv/david.alvarezrosa.com;
    index index.html;
    error_page 404 /404/index.html;

    if ($host != david.alvarezrosa.com) {
        return 301 https://david.alvarezrosa.com$request_uri;
    }

    location = /pasatiempos-dn { return 301 /pasatiempos-dn/; }

    location ^~ /pasatiempos-dn/ {
        alias /srv/pasatiempos-dn/;
        index index.php index.html;
        try_files $uri $uri/ /pasatiempos-dn/index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        }
    }

    location = /tres-en-raya { return 301 /tres-en-raya/; }
    location ~ ^/tic-tac-toe(/.*)?$ { return 301 /tres-en-raya$1; }
    location ~ ^/proyecto(/.*)?$ { return 301 /tres-en-raya$1; }

    location ^~ /tres-en-raya/ {
        alias /srv/tic-tac-toe/web/;
        index index.php index.html;
        try_files $uri $uri/ =404;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }

        location ~ /cgi-bin/(.+)$ {
            gzip off;
            fastcgi_pass unix:/var/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME /srv/tic-tac-toe/web/cgi-bin/$1;
            include fastcgi_params;
        }
    }

    location = /blog { return 301 /posts/; }
    location = /blog/ { return 301 /posts/; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=600, s-maxage=31536000";
    }

    location ~* \.(woff2?|ttf|webp|png|jpe?g|ico|svg|css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
