server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name api.alvarezrosa.com;

    ssl_certificate /etc/letsencrypt/live/api.alvarezrosa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.alvarezrosa.com/privkey.pem;

    add_header Alt-Svc 'h3=":443"; ma=604800';

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }
}
