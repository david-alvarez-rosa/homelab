map $http_user_agent $unwall_social_crawler {
  default 0;
  "~*(twitterbot|facebookexternalhit|facebookcatalog|slackbot|discordbot|whatsapp|telegrambot|linkedinbot|pinterest|redditbot|skypeuripreview|mastodon|bsky|cardyb|embedly|iframely|vkshare|flipboard)" 1;
}

server {
  include tls.conf;
  server_name unwall.app www.unwall.app;

  ssl_certificate /etc/letsencrypt/live/unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unwall.app/privkey.pem;
  ssl_early_data on;

  include common_headers.conf;

  root /srv/unwall.app;
  index index.html;

  if ($host != unwall.app) {
    return 301 https://unwall.app$request_uri;
  }

  location ~ \.map$ {
    return 404;
  }

  location / {
    include proxy_params;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @spa;
    if ($unwall_social_crawler) {
      proxy_pass http://unwall_api/preview$request_uri;
    }
    try_files $uri $uri/ /index.html;
  }

  location @spa {
    try_files /index.html =404;
  }

  location /assets/ {
    expires 1y;
    include common_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /robots.txt {
    include common_headers.conf;
    add_header Cache-Control "public, max-age=0, s-maxage=300";
    try_files $uri =404;
  }

  location = /index.html {
    include common_headers.conf;
    add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
  }

  location ~* \.(svg|ico|png|webmanifest)$ {
    expires 1d;
    include common_headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }
}
