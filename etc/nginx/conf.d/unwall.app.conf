server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name unwall.app www.unwall.app;

    ssl_certificate /etc/letsencrypt/live/unwall.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unwall.app/privkey.pem;

    add_header Alt-Svc 'h3=":443"; ma=604800';

    root /srv/unwall.app;
    index index.html;

    if ($host != unwall.app) {
        return 301 https://unwall.app$request_uri;
    }

    location / { try_files $uri $uri/ /index.html; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(svg|ico|png|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
