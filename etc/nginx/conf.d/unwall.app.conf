server {
  include tls.conf;
  server_name unwall.app www.unwall.app;

  ssl_certificate /etc/letsencrypt/live/unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unwall.app/privkey.pem;
  ssl_early_data on;

  include common_headers.conf;

  root /srv/unwall.app;
  index index.html;

  if ($host != unwall.app) {
    return 301 https://unwall.app$request_uri;
  }

  location ~ \.map$ {
    return 404;
  }

  location / { try_files $uri $uri/ /index.html; }

  location /assets/ {
    expires 1y;
    include common_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /index.html {
    include common_headers.conf;
    add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
  }

  location ~* \.(svg|ico|png|webmanifest)$ {
    expires 1d;
    include common_headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }
}
