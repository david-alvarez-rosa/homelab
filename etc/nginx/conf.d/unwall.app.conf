server {
  include tls.conf;
  server_name unwall.app www.unwall.app;

  ssl_certificate /etc/letsencrypt/live/unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unwall.app/privkey.pem;
  ssl_early_data on;

  include common_headers.conf;

  root /srv/unwall.app;
  index index.html;

  if ($host != unwall.app) {
    return 301 https://unwall.app$request_uri;
  }

  # Block public access to sourcemaps. With vite's "hidden" sourcemap mode the
  # JS no longer references them, but the .map files are still rsynced to disk;
  # this prevents anyone from grabbing source via URL guessing.
  location ~ \.map$ {
    return 404;
  }

  location / { try_files $uri $uri/ /index.html; }

  location /assets/ {
    expires 1y;
    include common_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # HTML: browser revalidates each visit (cheap conditional GET), Cloudflare
  # edge holds for 5 minutes, and may serve stale-while-revalidating for a day.
  # Requires a CF Cache Rule with "Respect origin headers" enabled for HTML
  # (Cloudflare does NOT cache text/html by default on free/pro).
  location = /index.html {
    include common_headers.conf;
    add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=86400";
  }

  location ~* \.(svg|ico|png|webmanifest)$ {
    expires 1d;
    include common_headers.conf;
    add_header Cache-Control "public, max-age=86400";
  }
}
