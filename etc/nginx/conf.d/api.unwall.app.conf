upstream unwall_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

map $http_user_agent $unwall_bot {
  default "";
  "~*(?<unwall_crawler>googlebot|googleother|google-extended|google-inspectiontool|bingbot|yandexbot|duckduckbot|baiduspider|semrushbot|ahrefsbot|mj12bot|dotbot|petalbot|applebot|bytespider|gptbot|oai-searchbot|chatgpt-user|ccbot|claudebot|anthropic-ai|perplexitybot|amazonbot|facebookexternalhit|meta-externalagent)" $unwall_crawler;
}

limit_req_zone $unwall_bot zone=unwall_bots:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=unwall_fetch:10m rate=4r/m;

server {
  include tls.conf;
  server_name api.unwall.app direct.api.unwall.app;

  if ($unwall_blocked) { return 403; }

  ssl_certificate /etc/letsencrypt/live/unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unwall.app/privkey.pem;

  include common_headers.conf;

  limit_req_status 429;

  client_body_buffer_size 128k;
  proxy_buffers 16 32k;
  proxy_busy_buffers_size 64k;
  proxy_max_temp_file_size 0;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /asset {
    limit_req zone=unwall_bots burst=5 nodelay;
    include proxy_params_sanitized.conf;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    include common_headers.conf;
    proxy_pass http://unwall_api;
  }

  location = /fetch {
    if ($arg_url ~* "^https?://") { return 403; }
    limit_req zone=unwall_fetch burst=8 nodelay;
    error_page 429 = @fetch_limited;
    limit_req zone=unwall_bots burst=5 nodelay;
    include proxy_params_sanitized.conf;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://unwall_api;
  }

  location @fetch_limited {
    include common_headers.conf;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Expose-Headers Retry-After always;
    add_header Retry-After 15 always;
    add_header Cache-Control no-store always;
    default_type application/json;
    return 429 '{"error":"Too many requests — please slow down and try again in a moment."}';
  }

  location / {
    limit_req zone=unwall_bots burst=5 nodelay;
    include proxy_params_sanitized.conf;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://unwall_api;
  }
}
