upstream unwall_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

# Disk-backed cache for proxied publisher subresources (CSS/JS/fonts/images).
# Honors the Cache-Control the backend emits per asset tier (immutable 30d /
# upstream-derived / short for dynamic), so entries with no-store (dev or
# per-request headers) are never cached. Survives backend restarts.
proxy_cache_path /var/cache/nginx/unwall_assets levels=1:2 keys_zone=unwall_assets:50m
                 max_size=2g inactive=21d use_temp_path=off;

server {
  include tls.conf;
  server_name api.unwall.app;

  ssl_certificate /etc/letsencrypt/live/api.unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.unwall.app/privkey.pem;

  include common_headers.conf;

  location /asset {
    include proxy_params;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_cache unwall_assets;
    proxy_cache_key $request_uri;
    # Collapse concurrent misses for the same asset into one backend request.
    proxy_cache_lock on;
    proxy_cache_lock_age 15s;
    proxy_cache_lock_timeout 20s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    include common_headers.conf;
    add_header X-Asset-Cache $upstream_cache_status;
    proxy_pass http://unwall_api;
  }

  location / {
    include proxy_params;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://unwall_api;
  }
}
