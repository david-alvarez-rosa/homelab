upstream unwall_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

map $http_user_agent $unwall_bot {
  default "";
  "~*(?<unwall_crawler>googlebot|googleother|google-extended|google-inspectiontool|bingbot|yandexbot|duckduckbot|baiduspider|semrushbot|ahrefsbot|mj12bot|dotbot|petalbot|applebot|bytespider|gptbot|oai-searchbot|chatgpt-user|ccbot|claudebot|anthropic-ai|perplexitybot|amazonbot|facebookexternalhit|meta-externalagent)" $unwall_crawler;
}

limit_req_zone $unwall_bot zone=unwall_bots:1m rate=10r/m;

proxy_cache_path /var/cache/nginx/unwall_assets levels=1:2 keys_zone=unwall_assets:50m
                 max_size=2g inactive=21d use_temp_path=off;

server {
  include tls.conf;
  server_name api.unwall.app;

  ssl_certificate /etc/letsencrypt/live/unwall.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/unwall.app/privkey.pem;

  include common_headers.conf;

  limit_req_status 429;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /asset {
    limit_req zone=unwall_bots burst=5 nodelay;
    include proxy_params;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_cache unwall_assets;
    proxy_cache_key $request_uri;
    proxy_cache_lock on;
    proxy_cache_lock_age 15s;
    proxy_cache_lock_timeout 20s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    include common_headers.conf;
    add_header X-Asset-Cache $upstream_cache_status;
    proxy_pass http://unwall_api;
  }

  location / {
    limit_req zone=unwall_bots burst=5 nodelay;
    include proxy_params;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_pass http://unwall_api;
  }
}
