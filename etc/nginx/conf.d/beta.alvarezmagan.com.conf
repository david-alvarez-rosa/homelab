server {
  include tls.conf;
  server_name beta.alvarezmagan.com;

  ssl_certificate /etc/letsencrypt/live/alvarezmagan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/alvarezmagan.com/privkey.pem;
  ssl_early_data on;

  include common_headers.conf;
  add_header X-Robots-Tag "noindex, nofollow" always;

  root /srv/beta.alvarezrosa.com;
  index index.html;
  error_page 404 /404/index.html;

  location / { try_files $uri $uri/ =404; }

  location ~* \.(woff2?|ttf|webp|png|jpe?g|ico|svg|css|js)$ {
    include common_headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
