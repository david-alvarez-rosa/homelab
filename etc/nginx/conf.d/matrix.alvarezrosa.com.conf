server {
  include tls.conf;
  server_name matrix.alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/alvarezrosa.com/privkey.pem;

  include common_headers.conf;

  client_max_body_size 100M;

  location = /.well-known/matrix/client {
    default_type application/json;
    include common_headers.conf;
    add_header Access-Control-Allow-Origin *;
    return 200 '{"m.homeserver":{"base_url":"https://matrix.alvarezrosa.com"},"io.element.e2ee":{"default":false,"force_disable":true}}';
  }

  location / {
    proxy_pass http://127.0.0.1:8008;
    include proxy_params;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
