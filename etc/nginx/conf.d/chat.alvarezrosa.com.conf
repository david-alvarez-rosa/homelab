server {
  include tls.conf;
  server_name chat.alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/alvarezrosa.com/privkey.pem;

  include common_headers.conf;
  include security_headers.conf;
  add_header Cache-Control "no-cache" always;

  root /usr/share/element-web;
  index index.html;

  location = /custom-translations.json {
    default_type application/json;
    include common_headers.conf;
    include security_headers.conf;
    add_header Cache-Control "no-cache" always;
    return 200 '{"composer|placeholder":{"en":"Send a message…","es":"Enviar un mensaje…"}}';
  }

  location = /escape-home.js {
    include common_headers.conf;
    include security_headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/javascript;
    alias /etc/element-web/escape-home.js;
  }

  location / {
    sub_filter "</head>" "<script src=\"/escape-home.js\"></script></head>";
    sub_filter_once on;
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    include common_headers.conf;
    include security_headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(woff2?|ttf|webp|png|jpe?g|ico|svg|css|js)$ {
    include common_headers.conf;
    include security_headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
