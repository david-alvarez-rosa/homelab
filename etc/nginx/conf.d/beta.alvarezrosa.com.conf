server {
  include tls.conf;
  server_name beta.alvarezrosa.com;

  ssl_certificate /etc/letsencrypt/live/alvarezrosa.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/alvarezrosa.com/privkey.pem;
  ssl_early_data on;

  include common_headers.conf;
  add_header X-Robots-Tag "noindex, nofollow" always;

  root /srv/beta.alvarezrosa.com;
  index index.html;
  charset utf-8;
  charset_types text/markdown text/plain text/xml application/rss+xml application/javascript;
  error_page 404 /404/index.html;

  location / { try_files $uri $uri/ =404; }

  include static_assets.conf;
}
