# Localhost-only HTTP proxy that egresses via the LTE modem.
# Bind pins outgoing connections to the modem interface IP; the ip rule in
# /etc/network/interfaces (from 192.168.8.100 -> table 100) routes them via 192.168.8.1.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Bind 192.168.8.100
Timeout 600
LogLevel Info
MaxClients 100
Allow 127.0.0.1
DisableViaHeader Yes
ConnectPort 443
ConnectPort 563
