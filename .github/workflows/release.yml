name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes from git log
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "## What's Changed"
            echo
            if [ -n "$PREV" ]; then
              git log --reverse --pretty=format:'- %s (%h)' "${PREV}..${TAG}"
            else
              git log --reverse --pretty=format:'- %s (%h)' "${TAG}"
            fi
            echo
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** $(git rev-parse --short "$PREV")...$(git rev-parse --short "$TAG")"
            fi
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
