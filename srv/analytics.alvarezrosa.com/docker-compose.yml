---
services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${DB_PASSWORD}@db:5432/umami
      SKIP_LOCATION_HEADERS: 1
      CLIENT_IP_HEADER: X-Real-IP
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres:15.19-alpine
    shm_size: 1g
    command: [postgres, -c, shared_buffers=1GB, -c, effective_cache_size=6GB, -c, work_mem=32MB, -c, maintenance_work_mem=512MB, -c, random_page_cost=1.1, -c, effective_io_concurrency=200]
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  umami-db-data:
